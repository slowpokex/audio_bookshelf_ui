<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Background Circle -->
  <circle cx="512" cy="512" r="512" fill="#6366F1"/>
  
  <!-- Book -->
  <rect x="280" y="200" width="360" height="480" rx="8" fill="#FFFFFF" opacity="0.95"/>
  <rect x="280" y="200" width="360" height="480" rx="8" fill="none" stroke="#4F46E5" stroke-width="8"/>
  
  <!-- Book Pages -->
  <line x1="340" y1="320" x2="600" y2="320" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/>
  <line x1="340" y1="380" x2="580" y2="380" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/>
  <line x1="340" y1="440" x2="600" y2="440" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/>
  <line x1="340" y1="500" x2="580" y2="500" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/>
  <line x1="340" y1="560" x2="600" y2="560" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/>
  <line x1="340" y1="620" x2="580" y2="620" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Bookbinding -->
  <rect x="450" y="200" width="24" height="480" rx="4" fill="#4F46E5"/>
  
  <!-- Headphones -->
  <g transform="translate(420, 550)">
    <!-- Left ear cup -->
    <circle cx="0" cy="0" r="80" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#4F46E5" stroke-width="6"/>
    <circle cx="0" cy="0" r="50" fill="#E5E7EB"/>
    
    <!-- Headband -->
    <path d="M-80,-20 Q-120,-40 -140,-60 L-140,-40 Q-120,-20 -80,0" 
          fill="#FFFFFF" stroke="#4F46E5" stroke-width="6" opacity="0.95"/>
    <path d="M80,-20 Q120,-40 140,-60 L140,-40 Q120,-20 80,0" 
          fill="#FFFFFF" stroke="#4F46E5" stroke-width="6" opacity="0.95"/>
    
    <!-- Right ear cup -->
    <circle cx="160" cy="0" r="80" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="160" cy="0" r="80" fill="none" stroke="#4F46E5" stroke-width="6"/>
    <circle cx="160" cy="0" r="50" fill="#E5E7EB"/>
  </g>
  
  <!-- Sound waves from headphones -->
  <g opacity="0.6">
    <path d="M240,440 Q220,420 220,400 Q220,380 240,360" 
          fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <path d="M240,360 Q200,340 200,300 Q200,260 240,240" 
          fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    
    <path d="M780,440 Q800,420 800,400 Q800,380 780,360" 
          fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <path d="M780,360 Q820,340 820,300 Q820,260 780,240" 
          fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
