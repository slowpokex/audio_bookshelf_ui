name: audio_bookshelf_ui
description: "Local-first audiobook management platform with AI-enhanced features"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation
  go_router: ^16.3.0

  # Audio
  just_audio: ^0.10.5
  audio_service: ^0.18.12
  audio_session: ^0.2.2

  # Local Storage
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # Network
  http: ^1.2.2
  dio: ^5.7.0

  # UI Components
  cupertino_icons: ^1.0.8
  material_design_icons_flutter: ^7.0.7296

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  path: ^1.9.0

  # File Handling
  file_picker: ^10.3.3
  permission_handler: ^12.0.1

  # Image Handling
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Notifications
  firebase_messaging: ^16.0.3
  flutter_local_notifications: ^19.5.0

  # Background Tasks
  workmanager: ^0.9.0+3

  # Biometric Authentication
  local_auth: ^3.0.0

  # Deep Linking

  # Platform Integration
  package_info_plus: ^9.0.0

  # Logging
  logger: ^2.4.0

  # JSON Serialization
  json_annotation: ^4.9.0

  # Internationalization
  flutter_gen: ^5.5.0

dev_dependencies:
  # Icon Generation
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.7.1
  json_serializable: ^6.8.0

  # Testing
  mockito: ^5.4.4
  bloc_test: ^9.1.7
  integration_test:
    sdk: flutter

  # Coverage
  coverage: ^1.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/icons/

  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: assets/fonts/Roboto-Regular.ttf
  #       - asset: assets/fonts/Roboto-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Roboto-Light.ttf
  #         weight: 300

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#6366F1"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21