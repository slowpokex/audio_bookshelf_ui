# Gradle JVM arguments for build performance
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Enable parallel builds and daemon for faster builds
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configureondemand=true

# Enable build cache for faster incremental builds
org.gradle.caching=true

# Enable configuration cache (faster build configuration)
# Note: Some plugins may not support this yet
# org.gradle.configuration-cache=true

# AndroidX migration settings
android.useAndroidX=true
android.enableJetifier=true

# Enable non-transitive R classes for better build performance
android.nonTransitiveRClass=true

# Enable non-final res IDs for better performance
android.nonFinalResIds=false

# Enable build features
android.enableR8.fullMode=true
