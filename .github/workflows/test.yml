    - name: Run security tests
      run: flutter test test/security/ --coverage
      
    - name: Generate security report
      run: |
        flutter test --coverage
        genhtml coverage/lcov.info -o coverage/html
        
    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: coverage/html/
        
  accessibility-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Run accessibility tests
      run: flutter test test/accessibility/ --coverage
      
    - name: Generate accessibility report
      run: |
        flutter test --coverage
        genhtml coverage/lcov.info -o coverage/html
        
    - name: Upload accessibility report
      uses: actions/upload-artifact@v4
      with:
        name: accessibility-report
        path: coverage/html/
        
  test-summary:
    runs-on: ubuntu-latest
    needs: [test, test-windows, test-macos, test-android, test-ios, test-web, test-desktop]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Run all tests
      run: flutter test --coverage
      
    - name: Generate comprehensive coverage report
      run: |
        genhtml coverage/lcov.info -o coverage/html
        echo "Coverage report generated successfully"
        
    - name: Upload comprehensive coverage report
      uses: actions/upload-artifact@v4
      with:
        name: comprehensive-coverage-report
        path: coverage/html/
        
    - name: Comment coverage on PR
      uses: actions/github-script@v6
      if: github.event_name == 'pull_request'
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // Read coverage summary
          const coverageFile = path.join('coverage', 'lcov.info');
          if (fs.existsSync(coverageFile)) {
            const coverage = fs.readFileSync(coverageFile, 'utf8');
            const lines = coverage.split('\n');
            let totalLines = 0;
            let coveredLines = 0;
            
            for (const line of lines) {
              if (line.startsWith('LF:')) {
                totalLines += parseInt(line.split(':')[1]);
              } else if (line.startsWith('LH:')) {
                coveredLines += parseInt(line.split(':')[1]);
              }
            }
            
            const percentage = totalLines > 0 ? (coveredLines / totalLines * 100).toFixed(2) : 0;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Test Coverage Report
              
              **Total Coverage**: ${percentage}%
              **Covered Lines**: ${coveredLines}
              **Total Lines**: ${totalLines}
              
              Coverage report is available in the artifacts.`
            });
          }
